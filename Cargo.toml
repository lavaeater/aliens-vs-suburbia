[package]
name = "aliens-vs-suburbia"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

# The root package is itself a member; list the local crates whose tests should also run
# under `cargo test` / `cargo nextest run` from the workspace root.
[workspace]
members = ["turbofacts", "bevy_mod_inverse_kinematics"]
# rusty_music is its own workspace (path dependency via the submodule).
exclude = ["rusty_music"]
resolver = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }    # BETA LINTS
# Nursery lint that (a) fires inside `#[derive(Reflect)]` output, where nothing can be
# done, and (b) turns readable if/else blocks into map_or_else closure soup.
option_if_let_else = "allow"
# Nursery: wants `a.mul_add(b, c)` and `.hypot()` in place of plain float expressions.
# Game maths is not numerics; the rewrites cost readability for no visible gain.
suboptimal_flops = "allow"
imprecise_flops = "allow"
# Nursery: `pub(crate)` items inside private modules. Stylistic; the explicit
# visibility documents intent even where it is technically redundant.
redundant_pub_crate = "allow"
# Downgraded from deny: grid/procgen math dominates the findings and is mostly
# structurally bounded by loop ranges, not genuinely overflow-prone. Fixed
# opportunistically where it could matter; see the module-level allows in
# src/map/* and src/general/systems/map_systems.rs for the bulk of it.
arithmetic_side_effects = "warn"
as_conversions = "allow"
doc_markdown = "allow"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
used_underscore_binding = "allow"
wildcard_imports = "allow"

[dependencies]
bevy = { version = "0.19.0", features = ["wayland", "3d", "ui", "bevy_feathers", "webp"] }
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "parry-f32", "debug-plugin", "collider-from-mesh", "simd", "parallel", "serialize", "bevy_scene", "bevy_picking", "xpbd_joints"] }
pathfinding = "4.6"
itertools = "0.15.0"
bevy_mod_outline = "0.13.0"
bevy-inspector-egui = "0.37.0"
lava_ui_builder = { path = "lava_ui_builder" }
turbofacts = { path = "turbofacts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12.1"
ureq = { version = "3.3.0", features = ["json"] }
dotenvy = "0.15"
urlencoding = "2"
bevy_wind_waker_shader = { path = "bevy_wind_waker_shader" }
bevy_skein = "0.6.0"
ratatui   = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
enumflags2 = { version = "0.7.12",  features = ["serde"] }
# Use the submodule checkout so local edits to rusty_music take effect immediately.
rusty_music = { path = "rusty_music" }
bevy_seedling = { version = "0.8.0", default-features = false, features = ["wav"] }

[features]
map-editor = ["dep:ratatui", "dep:crossterm"]

# bevy_seedling has no crates.io release targeting Bevy 0.19; its `master` (0.8.0) does.
# Pinned to a rev so builds stay reproducible. Drop this once 0.8 is published.
[patch.crates-io]
bevy_seedling = { git = "https://github.com/corvusprudens/bevy_seedling", rev = "9db62d12daa11a2ffbd9da1565154127eac0a241" }

# Enable max optimisations for dependencies, but not for our code:h
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
