[package]
name = "aliens-vs-suburbia"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

# The root package is itself a member; list the local crates whose tests should also run
# under `cargo test` / `cargo nextest run` from the workspace root.
[workspace]
members = ["turbofacts", "bevy_mod_inverse_kinematics"]
# rusty_music is its own workspace (path dependency via the submodule).
exclude = ["rusty_music", "spikes", "vendor"]
resolver = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
#nursery = { level = "warn", priority = -1 }    # BETA LINTS
# Nursery lint that (a) fires inside `#[derive(Reflect)]` output, where nothing can be
# done, and (b) turns readable if/else blocks into map_or_else closure soup.
option_if_let_else = "allow"
# Nursery: wants `a.mul_add(b, c)` and `.hypot()` in place of plain float expressions.
# Game maths is not numerics; the rewrites cost readability for no visible gain.
suboptimal_flops = "allow"
imprecise_flops = "allow"
# Nursery: `pub(crate)` items inside private modules. Stylistic; the explicit
# visibility documents intent even where it is technically redundant.
redundant_pub_crate = "allow"
# Downgraded from deny: grid/procgen math dominates the findings and is mostly
# structurally bounded by loop ranges, not genuinely overflow-prone. Fixed
# opportunistically where it could matter; see the module-level allows in
# src/map/* and src/general/systems/map_systems.rs for the bulk of it.
arithmetic_side_effects = "allow"
as_conversions = "allow"
# Grid <-> world maths casts between f32/i32/usize constantly. The try_from/from
# rewrites these lints ask for are noise for values bounded by the map size.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Local helper fns/consts declared next to their use site read fine.
items_after_statements = "allow"
# Bevy systems and component flag structs legitimately carry many bools.
struct_excessive_bools = "allow"
# Wants `&self` getters on small Copy components taken by value. Bevy queries hand
# out references; `self`-by-value reads as an oddity for a few bytes that the
# compiler copies anyway.
trivially_copy_pass_by_ref = "allow"
# Wants `assert_eq!(x, [] as [T; 0])` in place of `assert!(x.is_empty())`. The
# turbofish-heavy rewrite is harder to read than what it replaces.
assert_is_empty = "allow"
doc_markdown = "allow"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
panic = "deny"
panic_in_result_fn = "deny"
similar_names = "allow"
string_slice = "deny"
todo = "deny"
too_many_lines = "allow"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
used_underscore_binding = "allow"
wildcard_imports = "allow"

[dependencies]
bevy = { version = "0.20.1", features = ["wayland", "3d", "ui", "bevy_feathers", "webp"] }
# Physics: Jolt, through `src/physics/` (`docs/jolt-port.md`).
oxijolt = { version = "1.5", features = ["glam033"] }
pathfinding = "4.6"
itertools = "0.15.0"
bevy_mod_outline = "0.14.0"
bevy-inspector-egui = "0.38.0"
lava_ui_builder = { path = "lava_ui_builder", features = ["serde"] }
turbofacts = { path = "turbofacts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads OpenStreetMap .osm XML for the level importer (src/map/osm).
quick-xml = "0.41"
ron = "0.12.1"
ureq = { version = "3.3.0", features = ["json"] }
dotenvy = "0.15"
urlencoding = "2"
bevy_wind_waker_shader = { path = "bevy_wind_waker_shader" }
bevy_skein = "0.7.0"
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
enumflags2 = { version = "0.7.12", features = ["serde"] }
# Use the submodule checkout so local edits to rusty_music take effect immediately.
rusty_music = { path = "rusty_music", features = ["synth"] }
bevy_seedling = { version = "0.8.0", default-features = false, features = ["wav"] }
leafwing-input-manager = "0.22"
# GPU particles. Its `bevy-0.20` branch (no release yet); pinned so it cannot move under us.
bevy_sprinkles = { git = "https://github.com/doceazedo/sprinkles", rev = "7d8cae40af1213990e2586dd20474ba4c91d8539" }
ghx_proc_gen = "0.10"
# Behaviour trees for the townsfolk (`src/townsfolk/`). Upstream (RJ/bevy_behave) has no Bevy 0.20
# release or branch yet: a copy of its main (rev dbf9680, MIT/Apache) with the version bump.
bevy_behave = { path = "vendor/bevy_behave" }

# Enabled here only for its features; bevy_seedling depends on the same cpal. `default_host`
# then opens a native PipeWire stream, on a realtime thread via rtkit, and falls back to ALSA
# when PipeWire isn't running. `realtime-dbus` on its own does nothing on a desktop: cpal's ALSA
# host only promotes hw-like PCMs, not the pipewire-alsa plugin. Builds need libpipewire,
# libdbus and clang.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", default-features = false, features = ["pipewire", "realtime-dbus"] }

[features]
map-editor = ["dep:ratatui", "dep:crossterm"]

# bevy_seedling has no crates.io release targeting Bevy 0.20; our fork's `bevy-0.20` branch does.
# Pinned to a rev so builds stay reproducible. Drop this once 0.8 is published.
[patch.crates-io]
bevy_seedling = { git = "https://github.com/lavaeater/bevy_seedling", rev = "519c25bad4d7a36148136666f32499cececdd33b" }
# Firewheel 0.12 with its Bevy dependency bumped to 0.20 (and a `glam-33` feature), which the
# seedling fork needs: `vendor/firewheel-bevy-0.20` (see its README). Remove once upstream
# Firewheel supports Bevy 0.20.
firewheel-core = { path = "vendor/firewheel-bevy-0.20/firewheel-core" }
firewheel-graph = { path = "vendor/firewheel-bevy-0.20/firewheel-graph" }
firewheel-nodes = { path = "vendor/firewheel-bevy-0.20/firewheel-nodes" }
firewheel-cpal = { path = "vendor/firewheel-bevy-0.20/firewheel-cpal" }
firewheel-rtaudio = { path = "vendor/firewheel-bevy-0.20/firewheel-rtaudio" }
firewheel-symphonium = { path = "vendor/firewheel-bevy-0.20/firewheel-symphonium" }
firewheel-macros = { path = "vendor/firewheel-bevy-0.20/firewheel-macros" }
firewheel = { path = "vendor/firewheel-bevy-0.20/firewheel" }

# Enable max optimisations for dependencies, but not for our code:h
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
