[package]
name = "aliens-vs-suburbia"
version = "0.1.0"
edition = "2024"

# The root package is itself a member; list the local crates whose tests should also run
# under `cargo test` / `cargo nextest run` from the workspace root.
[workspace]
members = ["turbofacts"]
# rusty_music is its own workspace (path dependency via the submodule).
exclude = ["rusty_music"]
resolver = "2"

[dependencies]
bevy = { version = "0.18", features = ["wayland", "3d", "ui", "experimental_bevy_feathers", "webp"] }
avian3d = { version = "0.6", default-features = false, features = ["3d", "parry-f32", "debug-plugin", "collider-from-mesh", "simd", "parallel", "serialize", "bevy_scene", "bevy_picking", "xpbd_joints"] }
flagset = "0.4.4"
pathfinding = "4.6"
itertools = "0.14.0"
bevy_mod_outline = "0.12"
bevy-inspector-egui = "0.36"
lava_ui_builder = { path = "lava_ui_builder" }
turbofacts = { path = "turbofacts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12.1"
ureq = { version = "2", features = ["json"] }
dotenvy = "0.15"
urlencoding = "2"
bevy_wind_waker_shader = { path = "bevy_wind_waker_shader" }
image = { version = "0.25", default-features = false, features = ["png"] }
bevy_skein = "0.5.0"
bonsai-bt = "*"
ratatui   = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
enumflags2 = { version = "0.7.12",  features = ["serde"] }
strum = "0.28.0"
# Use the submodule checkout so local edits to rusty_music take effect immediately.
rusty_music = { path = "rusty_music" }
bevy_seedling = { version = "0.7.2", default-features = false, features = ["wav"] }

[features]
map-editor = ["dep:ratatui", "dep:crossterm"]

# Enable max optimizations for dependencies, but not for our code:h
[profile.dev.package."*"]
opt-level = 3
